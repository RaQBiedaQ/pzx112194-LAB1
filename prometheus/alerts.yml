# ai-generated: 50% - Claude (AI assistant) drafted the multiwindow multi-burn-rate rule shape (SRE Workbook) and the PromQL from the student's own slo.md numbers; the student reviewed the label contract against MONITORING-SPEC.md M-17/M-18 and verified both rules with promtool.
# prometheus/alerts.yml - our SLO alerts (MONITORING-SPEC.md M-17 to M-21).
#
# Both declared alerts are on the availability SLI (slo.md), multiwindow (long AND short window) and
# multi-burn-rate (different burn_rate each): the classic SRE Workbook pair. Every comparison compares
# against a constant (burn_rate * (1 - objective), M-18), so the checker's threshold mutants (x1.5,
# /1.5) can rewrite it, and the threshold stays visible here rather than hidden in a recording rule.
# Selecting job="svcdesk" (never an instance) and http_route="/kb/search" matches both the checker's own
# Prometheus (real traffic) and its behaviour probes (MONITORING-SPEC.md section 6.1, synthetic traffic).
groups:
  - name: svcdesk-slo
    rules:
      - alert: KbSearchAvailabilityFastBurn
        expr: |
          (
            sum(rate(http_server_request_duration_seconds_count{job="svcdesk", http_route="/kb/search", http_response_status_code=~"5.."}[1h]))
              /
            sum(rate(http_server_request_duration_seconds_count{job="svcdesk", http_route="/kb/search"}[1h]))
              > 14.4 * (1 - 0.99)
          )
          and
          (
            sum(rate(http_server_request_duration_seconds_count{job="svcdesk", http_route="/kb/search", http_response_status_code=~"5.."}[5m]))
              /
            sum(rate(http_server_request_duration_seconds_count{job="svcdesk", http_route="/kb/search"}[5m]))
              > 14.4 * (1 - 0.99)
          )
        for: 5m
        labels:
          service: svcdesk
          slo: availability
          severity: P1
        annotations:
          summary: "/kb/search: burning the 28-day error budget 14.4x faster than sustainable (1h and 5m windows both above threshold) - the 28-day budget is gone in under two days at this rate"

      - alert: KbSearchAvailabilitySlowBurn
        expr: |
          (
            sum(rate(http_server_request_duration_seconds_count{job="svcdesk", http_route="/kb/search", http_response_status_code=~"5.."}[6h]))
              /
            sum(rate(http_server_request_duration_seconds_count{job="svcdesk", http_route="/kb/search"}[6h]))
              > 6 * (1 - 0.99)
          )
          and
          (
            sum(rate(http_server_request_duration_seconds_count{job="svcdesk", http_route="/kb/search", http_response_status_code=~"5.."}[30m]))
              /
            sum(rate(http_server_request_duration_seconds_count{job="svcdesk", http_route="/kb/search"}[30m]))
              > 6 * (1 - 0.99)
          )
        for: 5m
        labels:
          service: svcdesk
          slo: availability
          severity: P2
        annotations:
          summary: "/kb/search: burning the 28-day error budget 6x faster than sustainable (6h and 30m windows both above threshold) - worth a look within the working day"
