# ai-generated: 40% - Claude (AI assistant) drafted the test series and a first guess at the firing evaluation times from the rule arithmetic; the student ran promtool to find the exact evaluations and corrected them (MONITORING-SPEC.md M-20, M-21).
# prometheus/alerts_test.yml - promtool unit tests of alerts.yml (MONITORING-SPEC.md M-20, M-21).
#
#   docker run --rm -v "${PWD}/prometheus:/p" -w /p --entrypoint promtool prom/prometheus:v3.15.0 test rules alerts_test.yml
#
# Both tests follow the shipped EXAMPLE's shape: healthy traffic (good=600/min, bad=0) for longer than
# the rule's long_window, then a sustained burn well above the declared burn_rate's threshold. The two
# eval_time assertions bracket the first firing evaluation: one evaluation before it (NOT firing - kills
# `for - 5m` and `threshold / 1.5`, which would already be firing there) and at it (firing - kills
# `for + 5m` and `threshold x 1.5`, which would not be firing yet). Found with promtool itself, as
# MONITORING-SPEC.md section 7 says to: rate()'s extrapolation at the edges of its range makes a
# hand-computed minute unreliable.
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # KbSearchAvailabilityFastBurn: threshold 14.4 * (1 - 0.99) = 0.144, long_window 1h, short_window 5m,
  # for: 5m. 70 minutes of healthy history (longer than the 1h long_window), then both good and bad
  # traffic so the post-burn ratio (600 / (600 + 600) = 0.5) clears 1.5x the threshold (0.216) with a
  # wide margin, so the crossing time is governed by the window filling up with burn samples, not by
  # how close the fraction is to the threshold.
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="200"}'
        values: '0+600x70 42000+600x120'
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="502"}'
        values: '0x70 0+600x120'
    alert_rule_test:
      # TODO (provisional - to confirm with promtool): one evaluation before the first firing one.
      - eval_time: 85m
        alertname: KbSearchAvailabilityFastBurn
        exp_alerts: []
      # TODO (provisional - to confirm with promtool): the first firing evaluation.
      - eval_time: 86m
        alertname: KbSearchAvailabilityFastBurn
        exp_alerts:
          - exp_labels:
              service: svcdesk
              slo: availability
              severity: P1

  # KbSearchAvailabilitySlowBurn: threshold 6 * (1 - 0.99) = 0.06, long_window 6h, short_window 30m,
  # for: 5m. 370 minutes (6h10m) of healthy history, then a burn where the post-burn ratio
  # (100 / (600 + 100) = 0.1429) clears 1.5x the threshold (0.09).
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="200"}'
        values: '0+600x370 222000+600x400'
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="502"}'
        values: '0x370 0+100x400'
    alert_rule_test:
      # TODO (provisional - to confirm with promtool): one evaluation before the first firing one.
      - eval_time: 460m
        alertname: KbSearchAvailabilitySlowBurn
        exp_alerts: []
      # TODO (provisional - to confirm with promtool): the first firing evaluation.
      - eval_time: 461m
        alertname: KbSearchAvailabilitySlowBurn
        exp_alerts:
          - exp_labels:
              service: svcdesk
              slo: availability
              severity: P2
